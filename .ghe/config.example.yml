repo:
  owner: "REPLACE_ME"
  name: "REPLACE_ME"
  # full_name: "REPLACE_ME/REPLACE_ME"

# Optional v1.0 multi-repo form.  When this list is non-empty the CLI writes
# one brief per entry.  A comma-separated ``--repo owner/a,b/c`` overrides it
# for a single invocation.
# repos:
#   - "REPLACE_ME/REPLACE_ME"
#   - "REPLACE_ME/REPLACE_ME"

github:
  # Optional for public repositories; recommended to avoid GitHub API limits.
  token: ${GITHUB_TOKEN}

model:
  # Recommended in the desktop app: reuses the local ``codex login`` /
  # ChatGPT session and needs no API key. For a headless server, switch to
  # ``openai-compatible`` and set base_url, api_key, and model_name.
  provider: codex_cli
  model_name: codex-default
  # base_url: ${LLM_BASE_URL}
  # api_key: ${LLM_API_KEY}

output:
  format: "markdown"  # markdown | action-summary
  output_dir: "reports"
  title: "Maintainer Brief - {date}"

analysis:
  lookback_days: 7
  top_n: 3
  min_issue_age_hours: 24
  max_issues_for_llm: 50
  # Roughly 30K tokens for an OpenAI-compatible chat prompt. The analyzer
  # drops the lowest-signal candidates when the payload would exceed this.
  max_prompt_chars: 90000

# Coding agent — which LLM provider the repair worker calls when it
# auto-fixes an issue. The desktop-friendly default reuses the local Codex
# login. ``openai_compatible`` also works for
# OpenAI, DeepSeek, OpenRouter, Ollama, vLLM, LM Studio, and any other
# server that follows the OpenAI Chat Completions schema.  Switch
# ``provider`` to ``anthropic`` to use the first-party Anthropic
# Messages API, or to ``claude_cli`` for the local Claude Code CLI. Run
# ``ghe --configure-coding-agent`` for an interactive walk-through.
coding_agent:
  provider: codex_cli
  # OpenAI's default endpoint.  Override for self-hosted Ollama /
  # vLLM / DeepSeek / OpenRouter, etc.
  # base_url: https://api.openai.com/v1
  # ``api_key`` is read directly; an empty value falls back to
  # $LLM_API_KEY so the secret can live in the environment.
  # api_key: ${LLM_API_KEY}
  # Any model the configured provider serves.  OpenAI: gpt-4o /
  # o1-mini / o3-mini.  Anthropic: claude-sonnet-4-5 / claude-opus-4-1.
  # Ollama: qwen2.5-coder:32b / deepseek-coder-v2:16b.
  # model: gpt-4o

  # Or Anthropic API (first-party Messages API):
  # provider: anthropic
  # api_key: ${ANTHROPIC_API_KEY}
  # model: claude-sonnet-4-5

  # Or self-hosted Ollama (no auth, but the schema still wants a key):
  # provider: openai_compatible
  # base_url: http://localhost:11434/v1
  # api_key: ollama
  # model: qwen2.5-coder:32b

  # Or fall back to the Claude Code CLI (legacy):
  # provider: claude_cli

# Verification executes repository tests only in an already-installed Docker
# runtime image by default. If no supported image is present, the repair stays
# "unverified" and cannot be published. This opt-in runs detected, fixed
# commands on the host and should only be enabled for repositories you trust.
repair:
  allow_host_verification: false

# Optional: directory holding the JSON history snapshots. Created on first
# write; the diff between the most recent snapshot and the new run is
# rendered into the Trend section of the report.
# history_dir: ".ghe/history"
