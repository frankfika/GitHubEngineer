[package]
name = "github-engineer-desktop"
version = "1.0.0"
description = "Conversation-first desktop maintainer assistant"
authors = ["GitHub Engineer contributors"]
edition = "2021"

[lib]
name = "github_engineer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
