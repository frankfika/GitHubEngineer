[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-engineer"
version = "0.1.0"
description = "Generate a Maintainer Brief for a GitHub repository: ranked issues, decision memory, and bounded coding-agent task handoff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "GitHub Engineer contributors" },
]
keywords = [
    "github",
    "maintainer",
    "brief",
    "issues",
    "ranking",
    "llm",
    "decisions",
    "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "PyGithub>=2.1.0,<3.0.0",
    "openai>=1.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "PyYAML>=6.0,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ghe = "src.main:main"

[project.urls]
"Source" = "https://github.com/your-org/github-engineer"
"Issues" = "https://github.com/your-org/github-engineer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
