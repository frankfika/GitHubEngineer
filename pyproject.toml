[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-engineer"
version = "1.0.0"
description = "Generate a Maintainer Brief for a GitHub repository: ranked issues, decision memory, and bounded coding-agent task handoff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "GitHub Engineer contributors" },
]
keywords = [
    "github",
    "maintainer",
    "brief",
    "issues",
    "ranking",
    "llm",
    "decisions",
    "agent",
    "openai-compatible",
    "ci",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "PyGithub>=2.1.0,<3.0.0",
    "openai>=1.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "PyYAML>=6.0,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=5.0",
    "build>=1.0",
    "pyinstaller>=6.0",
    "twine>=5.0",
]

[project.gui-scripts]
ghe-web = "src.main:main"

[project.scripts]
ghe = "src.main:main"

[project.urls]
"Source" = "https://github.com/your-org/github-engineer"
"Issues" = "https://github.com/your-org/github-engineer/issues"
"Changelog" = "https://github.com/your-org/github-engineer/blob/main/CHANGELOG.md"
"Security" = "https://github.com/your-org/github-engineer/blob/main/SECURITY.md"
"Architecture" = "https://github.com/your-org/github-engineer/blob/main/ARCHITECTURE.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
